schema_version: 1
id: joomla.toolkit.documentation
name: Joomla toolkit documentation
version: 1.0.0
kind: documentation
scope: workplace
package_root: global
description: Compact Joomla engineering rules, extension structure references, lifecycle, packaging, ACL, migration, and REST
  API notes.
resources:
- id: joomla-toolkit
  kind: reference
  title: Joomla toolkit
  description: Правила, паттерны расширений, lifecycle, packaging, ACL и migration references для Joomla.
  path_ref:
    registry: knowledge_roots
    id: local-docs
    relative_path: joomla/core/joomla-toolkit
  path_status: available
  load_policy: on_demand
  index_policy: fulltext
  source:
    kind: local_mirror
    root: local-docs
  update_policy:
    mode: manual_refresh
  versioning:
    mode: rolling_index
    version_field: version
    instance_id_template: '{id}@{version}'
  retention:
    policy: keep_versions
    keep_last_n: null
  snapshot_behavior:
    on_new_version: notify_only
    on_current_generation_changed: notify_only
    on_instance_missing: broken
    reproducibility: exact
